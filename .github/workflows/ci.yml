# Lightweight checks on develop / PRs (no image publish).

name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

# Only keep the latest run per branch/PR — older ones are cancelled instead of
# sitting queued until the 15m "failure" timeout (common with rapid pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Single job so we only need one Actions runner slot (backend + frontend).
  check:
    name: Backend + Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Import app package
        working-directory: backend
        env:
          ADMIN_PASSWORD: ci-check
          SECRET_KEY: ci-secret-not-for-production
          DATA_DIR: /tmp/rcon-manager-ci
        run: python -c "from app.main import app; print(app.title)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

# Build and publish a Docker image when a release tag is pushed.
#
# Workflow (recommended):
#   1. Work on `develop`
#   2. Merge to `master` when ready
#   3. Create and push a version tag on the master tip, e.g.:
#        git checkout master
#        git pull
#        git tag -a v0.1.0 -m "v0.1.0"
#        git push origin v0.1.0
#
# Images are published to GitHub Container Registry:
#   ghcr.io/<owner>/<repo>:<tag>
#   ghcr.io/<owner>/<repo>:latest   (only for tags without pre-release suffix)
#
# The job refuses to publish if the tagged commit is not on `master`.

name: Docker release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag points at master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master:refs/remotes/origin/master || git fetch origin main:refs/remotes/origin/master
          if git merge-base --is-ancestor HEAD origin/master; then
            echo "Tag commit is on master — OK"
          else
            echo "::error::Release tags must be created on a commit that is on the master branch."
            echo "Current HEAD is not an ancestor of origin/master."
            exit 1
          fi

      - name: Image name (lowercase for GHCR)
        id: meta_name
        shell: bash
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${OWNER}/${REPO}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta_name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
